server.port=8080

# ===== 本地消息队列配置 =====
# H2 嵌入式文件库：数据全部落在本地目录 data/lmq，无需独立部署任何中间件
# DB_CLOSE_ON_EXIT=FALSE：关闭 H2 自带的 JVM 关闭钩子，保证 Spring 停机流程先释放处理中消息
spring.datasource.url=jdbc:h2:file:./data/lmq/queue;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 消费组名（队列内部默认消费组，也可通过接口注册任意消费组）
lmq.default-group=default
# 最大重试次数：超过后进入死信（0 表示失败一次即进死信）
lmq.max-retries=3
# 指数退避基数（毫秒）：第 n 次失败后等待 base * multiplier^(n-1)，上限 cap
lmq.backoff.base-ms=1000
lmq.backoff.multiplier=2.0
lmq.backoff.cap-ms=30000
# 处理中租约（毫秒）：超过该时间未确认，消息被回收为可重新投递
lmq.lease-ms=30000
# 后台回收/重试扫描间隔（毫秒）
lmq.sweep-interval-ms=1000
