# Web 端口，脚本默认通过 8080 访问；0 表示随机端口
server.port=8080

# ===== 本地消息队列配置 =====
# 持久化目录：H2 数据文件、消息内容、去重记录、消费进度都落在这里
lq.data-dir=./data

# 消费租约时长（毫秒）：投递后超过该时间未确认，消息自动回到可投递状态
lq.lease-ms=30000

# 租约回收扫描间隔（毫秒）
lq.reap-interval-ms=1000

# 最大重试次数：第 N 次拒绝时，attempts > maxRetries 即转入死信
lq.max-retries=3

# 重试初始退避（毫秒），退避公式：baseDelay * 2^(attempt-1)
lq.retry-backoff-base-ms=1000

# 重试最大退避上限（毫秒）
lq.retry-backoff-max-ms=60000

# 首次投递可见延迟（毫秒），默认 0
lq.default-visible-delay-ms=0

logging.level.com.github.lechandonga=INFO
