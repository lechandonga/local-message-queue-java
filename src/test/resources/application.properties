server.port=0

# 测试使用独立的本地文件库，避免与运行时数据目录冲突
spring.datasource.url=jdbc:h2:file:./target/test-data/lmq-it;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

lmq.max-retries=3
lmq.backoff.base-ms=50
lmq.backoff.multiplier=2.0
lmq.backoff.cap-ms=400
lmq.lease-ms=30000
lmq.sweep-interval-ms=200

logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
